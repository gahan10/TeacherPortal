<!DOCTYPE html>
<html>
    <head>

        <title>TeacherPortal</title>
        <meta charset="utf-8">

    </head>
    
    <body>
        <div class="dashboard-main">
        <table width="100%" height="100%" border="0" cellspacing="7" cellpadding="7" bgcolor="wheat" >
            <tr>
                <tr>
                    <td align="right"><button>Home</button> <button type="submit" formaction="/logout">Logout</button></td>
                </tr>
                <td align="center">
                    <table width="100%" border="" bordercolor="black" cellspacing="8" cellpadding="8">
                        <tr>
                            <th><strong>Name</strong></th>
                            <th><strong>Subject</strong></th>
                            <th><strong>Mark</strong></th>
                            <th><strong>Action</strong></th>
                        </tr>
                        {% for students in students %}
                        <tr>
                            <form action="/update/{{ students.id }}" method="post">
                            <td><input type="text" name="name" value="{{ students.name }}"></td>
                            <td><input type="text" name="subject" value="{{ students.subject }}"></td>     
                            <td><input type="text" name="marks" value="{{ students.marks }}"></td>
                            <td><button type="submit">Update</button> <button type="submit" formaction="/delete/{{ students.id }}">Delete</button></td>  
                            </form>    
                        </tr>
                      {% endfor %}    
                    </table>
                    <table>
                        <tr>
                            <td align="left">
                                <button type="button" onclick="openNewWindow()">ADD</button>
                            </td>
                            <td></td>
                            <td></td>
                            <td></td>
                
                        </tr>
                    </table>
                </td>
            </tr>


        </table>
        </div>

        <script>
            function openNewWindow() {
                const newWindow = window.open("", "Add Student", "width=400,height=300");
           newWindow.document.write(`
<html>
<head>
    <title>Add a Student</title>
    <meta charset="utf-8">
</head>
<body>
    <form id="addStudentForm">
        <table align="center" width="100%" cellspacing="8" cellpadding="8">
            <tr>
                <td>Name : <input type="text" name="name"></td>
            </tr>
            <tr>
                <td>Subject : <input type="text" name="subject"></td>
            </tr>
            <tr>
                <td>Marks : <input type="text" name="marks"></td>
            </tr>
            <tr>
                <td><button type="submit">Add</button></td>
            </tr>
        </table>
    </form>

    <script>
        document.getElementById('addStudentForm')
        .addEventListener('submit', function(e) {
            e.preventDefault();

            const formData = new FormData(this);

            fetch('/add', {
                method: 'POST',
                body: formData
            })
            .then(response => {
                if (response.ok) {
                    window.opener.location.reload();
                    window.close();
                } else {
                    alert("Error submitting form");
                }
            });
        });
    <\/script>
</body>
</html>
`);
            }

        </script>
    </body>
</html>
